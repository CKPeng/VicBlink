[package]
name = "vic-blink"
version = "1.0.0"
description = "20-20-20 Rule Eye Care Desktop Assistant"
authors = ["Vic"]
edition = "2021"

[lib]
name = "vic_blink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]